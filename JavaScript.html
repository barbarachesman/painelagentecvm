<script>
  (function () {
    const MONTHS = [
      'janeiro',
      'fevereiro',
      'março',
      'abril',
      'maio',
      'junho',
      'julho',
      'agosto',
      'setembro',
      'outubro',
      'novembro',
      'dezembro',
    ];

    const WEEKDAYS = [
      'domingo',
      'segunda-feira',
      'terça-feira',
      'quarta-feira',
      'quinta-feira',
      'sexta-feira',
      'sábado',
    ];

    function formatGreetingDate(date) {
      const weekday = WEEKDAYS[date.getUTCDay()];
      const day = date.getUTCDate();
      const month = MONTHS[date.getUTCMonth()];
      const year = date.getUTCFullYear();
      return weekday + ', ' + day + ' de ' + month + ' de ' + year;
    }

    const MONTHS_SHORT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    const COVER_ISO = '2026-11-09';

    function yesterdayInSaoPaulo(now) {
      const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Sao_Paulo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      });
      const parts = fmt.format(now).split('-').map(Number);
      const date = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2] - 1, 15, 0, 0));
      return { iso: fmt.format(date), date: date };
    }

    function formatShortDate(yday) {
      const parts = yday.iso.split('-').map(Number);
      return parts[2] + ' ' + MONTHS_SHORT[parts[1] - 1] + ' ' + parts[0];
    }

    function applyDiaDate(now) {
      const yday = yesterdayInSaoPaulo(now);
      const short = formatShortDate(yday);
      const greeting = document.getElementById('greeting-date');
      if (greeting) greeting.textContent = 'ontem · ' + formatGreetingDate(yday.date);
      const badge = document.getElementById('dia-badge');
      if (badge) badge.textContent = short;
      const banner = document.getElementById('dia-banner');
      if (banner) banner.textContent = short;

      const hasCover = yday.iso === COVER_ISO;
      document.querySelectorAll('#view-dia .js-dia-value').forEach(function (el) {
        if (!el.hasAttribute('data-original')) el.setAttribute('data-original', el.textContent);
        el.textContent = hasCover ? el.getAttribute('data-original') : '—';
      });
      document.querySelectorAll('#view-dia .js-dia-delta').forEach(function (el) {
        el.hidden = !hasCover;
      });
      const note = document.getElementById('dia-sem-capa');
      if (note) note.hidden = hasCover;
    }

    function setActiveNav(viewId) {
      document.querySelectorAll('.nav-btn').forEach(function (btn) {
        const active = btn.getAttribute('data-view') === viewId;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function bindDives() {
      document.querySelectorAll('.dive-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const body = document.getElementById(btn.getAttribute('aria-controls'));
          const item = btn.closest('.dive-item');
          const action = btn.querySelector('.dive-action');
          const open = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', open ? 'false' : 'true');
          if (item) item.classList.toggle('is-open', !open);
          if (body) body.hidden = open;
          if (action) action.textContent = open ? 'Abrir' : 'Fechar';
        });
      });
    }

    const HOME_VIEWS = ['dia', 'retencao'];

    function showViews(ids) {
      document.querySelectorAll('.view').forEach(function (section) {
        const viewId = section.id.replace('view-', '');
        section.hidden = ids.indexOf(viewId) === -1;
      });
    }

    function bindNav() {
      document.querySelectorAll('.nav-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const viewId = btn.getAttribute('data-view');
          setActiveNav(viewId);
          showViews(viewId === 'dia' ? HOME_VIEWS : [viewId]);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      applyDiaDate(new Date());
      showViews(HOME_VIEWS);
      setActiveNav('dia');
      bindNav();
      bindDives();
    });
  })();
</script>
